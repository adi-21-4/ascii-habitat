<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>New Tab</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/page.css" />
  </head>
  <body>
    <canvas aria-hidden="true"></canvas>

    <!-- Displacement map for the liquid-glass refraction. -->
    <svg class="filters" width="0" height="0" aria-hidden="true">
      <filter id="liquid-glass" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.007 0.011" numOctaves="2" seed="11" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="map" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="40" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <section class="clock" aria-label="Current date and time">
      <time class="clock-time"></time>
      <time class="clock-date"></time>
    </section>

    <nav class="top-bar" aria-label="Quick access">
      <div class="animal-switcher">
        <button class="animal-current glass" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="animal-choices">
          <span class="dot current-dot" aria-hidden="true"></span>
          <span class="current-animal-name">Butterfly</span>
          <svg class="animal-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
        </button>
        <div class="choices glass" id="animal-choices" role="radiogroup" aria-label="Choose an animal" inert></div>
      </div>
      <div class="quick-links glass" aria-label="Quick links"></div>
    </nav>

    <main class="stage">
      <div class="masthead">
        <h1 class="greeting">Hello, User</h1>
      </div>
      <form class="composer glass" autocomplete="off">
        <div class="composer-field">
          <svg class="composer-search" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="m15.5 15.5 5 5" />
          </svg>
          <input type="search" name="prompt" placeholder="Search the web..." aria-label="Search the web" />
          <button type="submit" class="send" aria-label="Search" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19V5M5 12l7-7 7 7" />
            </svg>
          </button>
        </div>
      </form>
    </main>

    <script type="module" src="/demo.ts"></script>
  </body>
</html>
